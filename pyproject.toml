[project]
name = "grafo-agentico"
version = "0.3.0"
description = "Grafo agéntico de desarrollo: router propio + Qwen local + OpenCode Go"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6",
    "openai>=1.40",
    "pyyaml>=6",
]

[project.scripts]
grafo = "grafo.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grafo"]
