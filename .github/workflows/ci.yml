name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependencias (falla si uv.lock no está al día)
        run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run grafo --help
